[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herbal-almanac"
version = "0.1.0"
description = "Research tools for Ayurvedic plant records and treatments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
    "rich==15.0.0",
    "typer==0.27.3",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "deep-translator==1.11.4",
    "pytest>=8",
    "twine>=5",
]
translate = ["deep-translator==1.11.4"]

[project.scripts]
herbal-almanac = "herbal_almanac.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["herbal_almanac*"]

[tool.pytest.ini_options]
pythonpath = ["src"]